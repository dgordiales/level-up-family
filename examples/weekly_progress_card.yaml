type: custom:button-card
show_name: false
show_icon: false
show_state: false
triggers_update:
  - sensor.luf_theme
  - binary_sensor.player1_objetivo_semanal_conseguido
  - binary_sensor.player2_objetivo_semanal_conseguido
  - input_number.luf_weekly_goal_pct
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
styles:
  card:
    - background: '#1e1e2e'
    - border: 1px solid rgba(205, 214, 244, 0.08)
    - border-radius: 16px
    - padding: 12px
    - box-shadow: none
  grid:
    - grid-template-areas: '"cabecera" "contenido"'
    - grid-template-columns: minmax(0, 1fr)
    - grid-template-rows: 28px auto
    - row-gap: 8px
  custom_fields:
    cabecera:
      - width: 100%
      - min-width: 0
    contenido:
      - width: 100%
      - min-width: 0
custom_fields:
  cabecera: |
    <div class="lf-cabecera">
      <ha-icon icon="mdi:arrow-up-bold-circle"></ha-icon>
      <span>Level Up Family</span>
      <small>Progreso semanal</small>
    </div>
  contenido: |
    [[[
      const numero = (valor) => {
        if (valor === null || valor === undefined) return null;
        const texto = String(valor).trim().replace(',', '.');
        if (!texto) return null;
        const n = Number(texto);
        return Number.isFinite(n) ? n : null;
      };

      const formato = (n, decimales = 0) =>
        n.toLocaleString('es-ES', {
          minimumFractionDigits: decimales,
          maximumFractionDigits: decimales
        });

      const objetivoGeneral =
        numero(states['input_number.luf_weekly_goal_pct']?.state) ?? 75;

      const tema = states['sensor.luf_theme']?.attributes || {};
      const temporada = {
        primary: tema.primary || '#7a28ff',
        secondary: tema.secondary || '#d66cff',
        highlight: tema.highlight || '#ff9cff',
        accent: tema.accent || '#65ddff',
        glow: tema.glow || 'rgba(169, 62, 255, 0.85)',
        track: tema.track || '#07132f',
        border: tema.border_strong || 'rgba(93, 125, 255, 0.72)'
      };
      const dorado = {
        ...temporada,
        primary: tema.success_primary || '#d99000',
        secondary: tema.success_secondary || '#ffbd18',
        highlight: tema.success_highlight || '#fff0a0',
        accent: tema.success_accent || '#ffd83d',
        glow: tema.success_glow || 'rgba(255, 183, 0, 0.95)',
        border: tema.success_border || 'rgba(255, 200, 35, 0.92)'
      };

      const jugadores = [
        {
          nombre: 'player1',
          entidad: 'binary_sensor.player1_objetivo_semanal_conseguido'
        },
        {
          nombre: 'player2',
          entidad: 'binary_sensor.player2_objetivo_semanal_conseguido'
        }
      ];

      const purpurina = () => Array.from({ length: 14 }, (_, i) => {
        const origen = ((((i * 5) % 14) / 13) * 100).toFixed(2);
        const tamano = (1.4 + (i % 4) * 0.45).toFixed(2);
        const duracion = (1.55 + (i % 5) * 0.19).toFixed(2);
        const retraso = (-i * 0.23).toFixed(2);
        const deriva = -8 + ((i * 7) % 17);
        const altura = -(8 + ((i * 7) % 9));
        const giro = 75 + ((i * 53) % 210);
        return `<span class="lf-particula" style="
          --lf-origen:${origen}%;--lf-tamano:${tamano}px;
          --lf-duracion:${duracion}s;--lf-retraso:${retraso}s;
          --lf-deriva:${deriva}px;--lf-altura:${altura}px;
          --lf-giro:${giro}deg;
        "></span>`;
      }).join('');

      const filas = jugadores.map((jugador) => {
        const entidad = states[jugador.entidad];
        const a = entidad?.attributes || {};
        const hechas = numero(a.misiones_completadas);
        const total = numero(a.misiones_previstas);
        const disponible =
          ['on', 'off'].includes(entidad?.state) &&
          hechas !== null && hechas >= 0 &&
          total !== null && total >= 0;

        const conTareas = disponible && total > 0;
        const porcentaje = conTareas
          ? (numero(a.porcentaje_actual) ?? (hechas / total * 100))
          : 0;
        const ancho = Math.max(0, Math.min(100, porcentaje));
        const objetivo = Math.max(0, Math.min(100,
          numero(a.objetivo_pct) ?? objetivoGeneral
        ));
        const conseguido = conTareas && entidad.state === 'on';
        const colores = conseguido ? dorado : temporada;
        const estilo = Object.entries(colores)
          .map(([nombre, valor]) => `--lf-${nombre}:${valor}`)
          .join(';');

        const cuenta = !disponible
          ? 'Sin datos'
          : total === 0
            ? 'Sin tareas'
            : `${formato(hechas)} / ${formato(total)}`;
        const textoPct = conTareas
          ? `${formato(porcentaje, 2)} %`
          : '—';
        const accesibilidad = conTareas
          ? `role="progressbar" aria-label="Progreso semanal de ${jugador.nombre}"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="${ancho}"`
          : '';

        return `
          <div class="lf-jugador" data-achieved="${conseguido}" style="${estilo};">
            <div class="lf-datos">
              <span class="lf-nombre">${jugador.nombre}</span>
              <span class="lf-cuenta">${cuenta}</span>
              <span class="lf-porcentaje">${textoPct}</span>
            </div>
            <div class="lf-barra" ${accesibilidad}>
              <div class="lf-relleno"
                style="width:${ancho > 0 ? `max(0px, calc(${ancho}% - 2px))` : '0'};">
                ${ancho > 0 ? '<div class="lf-extremo"></div>' : ''}
                ${ancho > 0 ? `<div class="lf-purpurina" aria-hidden="true">${purpurina()}</div>` : ''}
              </div>
              <div class="lf-objetivo"
                style="left:clamp(1px, ${objetivo}%, calc(100% - 1px));"
                title="Objetivo semanal: ${formato(objetivo)} %">
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `<div class="lf-contenido">${filas}</div>`;
    ]]]
extra_styles: |
  .lf-cabecera {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #cdd6f4;
    text-align: left;
  }
  .lf-cabecera ha-icon {
    width: 27px;
    height: 27px;
    flex-shrink: 0;
    color: #cba6f7;
  }
  .lf-cabecera span {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
  }
  .lf-cabecera small {
    color: #a6adc8;
    font-size: 10px;
    font-weight: 400;
  }
  .lf-contenido {
    box-sizing: border-box;
    display: grid;
    gap: 22px;
    padding: 14px 12px 16px;
    border-radius: 12px;
    background: #252536;
    text-align: left;
  }
  .lf-datos {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    line-height: 20px;
  }
  .lf-nombre {
    color: #cdd6f4;
    font-size: 14px;
    font-weight: 600;
  }
  .lf-cuenta {
    color: #a6adc8;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .lf-porcentaje {
    margin-left: auto;
    color: var(--lf-accent);
    font-size: 20px;
    line-height: 20px;
    font-weight: 900;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px var(--lf-glow);
    transition: color .35s ease, text-shadow .35s ease;
  }
  .lf-barra {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 14px;
    border-radius: 10px;
    background: var(--lf-track);
    border: 1px solid var(--lf-border);
    box-shadow: inset 0 0 7px rgba(0,0,0,.75);
    overflow: visible;
    transition: border .35s ease, box-shadow .35s ease;
  }
  .lf-relleno {
    position: absolute;
    left: 1px;
    top: 1px;
    bottom: 1px;
    max-width: calc(100% - 2px);
    border-radius: 8px;
    background: linear-gradient(90deg,
      var(--lf-primary) 0%,
      var(--lf-secondary) 68%,
      var(--lf-highlight) 100%);
    box-shadow: 0 0 6px var(--lf-glow), 0 0 13px var(--lf-glow);
    transition: width .45s ease, background .35s ease, box-shadow .35s ease;
  }
  .lf-extremo {
    position: absolute;
    right: -1px;
    top: 0;
    width: 9px;
    height: 100%;
    max-width: 100%;
    border-radius: 50%;
    background: var(--lf-highlight);
    box-shadow: 0 0 6px var(--lf-highlight), 0 0 12px var(--lf-glow);
  }
  .lf-objetivo {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 2px;
    border-radius: 2px;
    background: rgba(255,255,255,.92);
    transform: translateX(-50%);
    box-shadow: 0 0 5px rgba(255,255,255,.9);
    z-index: 5;
    transition: left .35s ease;
  }
  .lf-jugador[data-achieved="true"] .lf-porcentaje {
    text-shadow: 0 0 15px var(--lf-glow);
  }
  .lf-jugador[data-achieved="true"] .lf-barra {
    box-shadow: inset 0 0 7px rgba(0,0,0,.75),
      0 0 8px var(--lf-glow), 0 0 16px var(--lf-glow);
  }
  .lf-jugador[data-achieved="true"] .lf-relleno {
    box-shadow: 0 0 9px var(--lf-glow),
      0 0 20px var(--lf-glow), 0 0 28px var(--lf-glow);
  }
  .lf-jugador[data-achieved="true"] .lf-extremo {
    width: 11px;
    box-shadow: 0 0 6px var(--lf-highlight), 0 0 18px var(--lf-glow);
  }

  .lf-purpurina {
    position: absolute;
    left: 50%;
    right: 0;
    top: 50%;
    height: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 4;
  }
  .lf-particula {
    position: absolute;
    left: var(--lf-origen);
    top: -1px;
    display: block;
    width: var(--lf-tamano);
    height: var(--lf-tamano);
    border-radius: 25%;
    color: var(--lf-secondary);
    background: currentColor;
    box-shadow: 0 0 3px var(--lf-glow);
    opacity: 0;
    animation: lf-purpurina-flotar var(--lf-duracion) linear infinite;
    animation-delay: var(--lf-retraso);
  }
  .lf-particula:nth-child(3n) {
    color: var(--lf-highlight);
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%,
      50% 100%, 38% 62%, 0% 50%, 38% 38%);
    width: calc(var(--lf-tamano) * 1.7);
    height: calc(var(--lf-tamano) * 1.7);
  }
  .lf-particula:nth-child(4n) {
    color: var(--lf-primary);
    border-radius: 50%;
  }
  @keyframes lf-purpurina-flotar {
    0% {
      opacity: 0;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(.6);
    }
    12% { opacity: .95; }
    45% {
      opacity: .8;
      transform: translate3d(
        calc(var(--lf-deriva) * .45), var(--lf-altura), 0
      ) rotate(calc(var(--lf-giro) * .5)) scale(1);
    }
    72% { opacity: .5; }
    100% {
      opacity: 0;
      transform: translate3d(
        var(--lf-deriva), calc(var(--lf-altura) + 11px), 0
      ) rotate(var(--lf-giro)) scale(.3);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .lf-purpurina { display: none; }
  }
