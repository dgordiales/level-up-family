input_number:
  champ_player2_points_total:
    name: player2 - XP total
    min: 0
    max: 1000000
    step: 1
    mode: box
    icon: mdi:star-circle
  champ_player2_points_this_week:
    name: player2 - XP esta semana
    min: 0
    max: 10000
    step: 1
    mode: box
    icon: mdi:star
  champ_player2_streak_days:
    name: player2 - Racha diaria
    min: 0
    max: 3650
    step: 1
    mode: box
    icon: mdi:fire
  champ_player2_streak_weeks:
    name: player2 - Racha semanal
    min: 0
    max: 520
    step: 1
    mode: box
    icon: mdi:calendar-check
  champ_player2_weekly_tasks_due:
    name: player2 - Misiones previstas semana
    min: 0
    max: 100
    step: 1
    mode: box
    icon: mdi:clipboard-list
  champ_player2_weekly_tasks_completed:
