    step: 1
    mode: box
    unit_of_measurement: XP
    icon: mdi:alert-octagon-outline
  champ_player2_task_higiene_personal_week:
    name: player2 - Higiene personal
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:face-woman-shimmer
  champ_player2_task_tareas_cole_week:
    name: player2 - Hacer tareas del cole
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:book-open-variant
  champ_player2_task_poner_mesa_week:
    name: player2 - Poner la mesa
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:table-chair
  champ_player2_task_quitar_mesa_week:
    name: player2 - Quitar la mesa
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:table-chair
  champ_player2_task_recoger_cosas_week:
    name: player2 - Recoger sus cosas
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:basket
  champ_player2_task_agenda_week:
    name: player2 - Escribir en la agenda
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:notebook-edit
  champ_player2_task_colocar_ropa_week:
    name: player2 - Colocar la ropa
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:tshirt-crew
  champ_player2_task_ducharse_week:
    name: player2 - Ducharse
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:shower
  champ_player2_task_tratar_bien_week:
    name: player2 - Tratar bien a los demás
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:heart
  champ_player2_task_mochila_week:
    name: player2 - Ordenar mochila y estuche
    min: 0
    max: 127
    step: 1
    mode: box
    icon: mdi:bag-personal
input_text:
  champ_player2_todays_tasks:
    name: player2 - Misiones de hoy
    max: 255
    icon: mdi:format-list-checks
  champ_player2_weekly_tip:
    name: player2 - Consejo semanal
    max: 255
    icon: mdi:lightbulb-outline
  champ_player2_last_applied_week:
    name: Level Up Family - player2 - Última semana aplicada
    max: 10
  champ_player2_active_week:
    name: Level Up Family - player2 - Semana activa
    max: 10
  champ_player2_last_daily_close:
    name: Level Up Family - player2 - Último cierre diario
    max: 10
  champ_player2_weekly_reward:
    name: player2 - Recompensa semanal
    max: 255
    icon: mdi:gift-outline
input_datetime:
  champ_player2_last_task_completion:
    name: player2 - Última misión completada
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline
  champ_player2_task_date:
    name: player2 - Fecha misión
    has_date: true
    has_time: false
    icon: mdi:calendar-edit
script:
  champ_player2_marcar_mision:
    alias: Level Up Family - player2 - Marcar misión
    icon: mdi:check-circle-outline
    mode: queued
    fields:
      tarea:
        name: Tarea semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        required: true
        selector:
          date: null
    sequence:
    - action: script.champ_task_mutate
      data:
        operation: mark
        player: player2
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  champ_player2_desmarcar_mision:
    alias: Level Up Family - player2 - Desmarcar misión
    icon: mdi:checkbox-blank-circle-outline
    mode: queued
    fields:
      tarea:
        name: Tarea semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        required: true
        selector:
          date: null
    sequence:
    - action: script.champ_task_mutate
      data:
        operation: unmark
        player: player2
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  champ_player2_toggle_mision:
    alias: Level Up Family - player2 - Alternar misión
    icon: mdi:checkbox-marked-circle-auto-outline
    mode: queued
    max: 10
    fields:
      tarea:
        name: Tarea semanal
        description: Entidad input_number que contiene el bitmask semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        description: Fecha de la misión en formato YYYY-MM-DD
        required: true
        selector:
          date: null
    sequence:
    - action: script.champ_task_mutate
      data:
        operation: toggle
        player: player2
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  champ_player2_cerrar_dia:
    alias: Level Up Family - player2 - Cerrar día
    icon: mdi:calendar-check-outline
    mode: queued
    max: 10
    fields:
      fecha:
        name: Fecha a cerrar
        required: true
        selector:
          date: null
    sequence:
    - condition: state
      entity_id: input_boolean.champ_maintenance
      state: 'off'
    - condition: template
      value_template: '{{ has_value(''sensor.champ_task_catalog'') }}'
    - variables:
        fecha_cierre: '{{ fecha }}'
        semana_fecha: |-
          {{
            '%04d-W%02d'
            | format(
                strptime(fecha, '%Y-%m-%d').isocalendar().year | int,
                strptime(fecha, '%Y-%m-%d').isocalendar().week | int
              )
          }}
        semana_activa: '{{ states(''input_text.champ_player2_active_week'') }}'
        indice_dia: '{{ strptime(fecha, ''%Y-%m-%d'').weekday() | int }}'
        bit: '{% set d = strptime(fecha, ''%Y-%m-%d'').weekday() %} {{ [1, 2, 4, 8, 16, 32, 64][d] }}'
    - condition: template
      value_template: '{{ semana_fecha == semana_activa }}'
    - variables:
        dia_perfecto: |-
          {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
          {% set ns = namespace(due=0, done=0) %}
          {% set b = [1,2,4,8,16,32,64][indice_dia | int] %}
          {% for task in tasks if not task.once %}
            {% if task.days | bitwise_and(b) %}
              {% set ns.due = ns.due + 1 %}
              {% if states(task.entity) | int(0) | bitwise_and(b) %}{% set ns.done = ns.done + 1 %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ 1 if ns.due > 0 and ns.done == ns.due else 0 }}
    - condition: template
      value_template: |-
        {% set start = states('input_datetime.champ_season_start') %} {{ start not in ['', 'unknown', 'unavailable']
           and fecha_cierre | string >= start }}
    - action: shell_command.champ_db_close_day
      data:
        player_key: player2
        day_date: '{{ fecha_cierre }}'
        perfect: '{{ dia_perfecto | int }}'
      response_variable: resultado_dia
    - condition: template
      value_template: '{{ resultado_dia.returncode | int == 0 }}'
    - variables:
        respuesta_dia: '{{ resultado_dia.stdout | from_json }}'
    - condition: template
      value_template: '{{ respuesta_dia.ok | default(false) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player2_streak_days
      data:
        value: '{{ respuesta_dia.current_streak | int(0) }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.champ_player2_last_daily_close
      data:
        value: '{{ fecha_cierre }}'
  champ_player2_cerrar_semana:
    alias: Level Up Family - player2 - Cerrar semana
    icon: mdi:calendar-check
    mode: single
    sequence:
    - condition: state
      entity_id: input_boolean.champ_maintenance
      state: 'off'
    - condition: template
      value_template: '{{ has_value(''sensor.champ_task_catalog'') }}'
    - variables:
        fin_semana: |-
          {{
            (
              now()
              - timedelta(days=now().isoweekday())
            ).date()
          }}
        inicio_semana: |-
          {{
            (
              now()
              - timedelta(days=now().isoweekday() + 6)
            ).date()
          }}
        ano_semana: |-
          {{
            (
              now()
              - timedelta(days=now().isoweekday())
            ).strftime('%G') | int
          }}
        numero_semana: |-
          {{
            (
              now()
              - timedelta(days=now().isoweekday())
            ).strftime('%V') | int
          }}
        clave_semana: |-
          {{
            '%04d-W%02d'
            | format(ano_semana | int, numero_semana | int)
          }}
        clave_semana_actual: |-
          {{
            '%04d-W%02d'
            | format(
                now().strftime('%G') | int,
                now().strftime('%V') | int
              )
          }}
        temporada: '{{ states(''input_number.champ_season_number'') | int(1) }}'
        misiones_previstas: '{{ states(''sensor.player2_misiones_previstas_calculadas'') | int(0) }}'
        misiones_completadas: |-
          {{
            states(
              'sensor.player2_misiones_completadas_calculadas'
            ) | int(0)
          }}
        xp_tareas: |-
          {{
            states(
              'sensor.player2_xp_tareas_semana'
            ) | int(0)
          }}
        penalizaciones: |-
          {{
            states(
              'input_number.champ_player2_penalties_this_week'
            ) | int(0)
          }}
        task_entities: |-
          {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
          {{ tasks | map(attribute='entity') | list }}
    - condition: template
      value_template: '{{ states(''input_text.champ_player2_active_week'') == clave_semana or states(''input_text.champ_player2_last_applied_week'')
        == clave_semana }}'
    - variables:
        calculo_dias_semana: |-
          {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
          {% set ns = namespace(total=0) %}
          {% set limit = 7 %}
          {% for i in range(limit | int) %}
            {% set b = [1,2,4,8,16,32,64][i] %}
            {% set day = namespace(due=0, done=0) %}
            {% for task in tasks if not task.once %}
              {% if task.days | bitwise_and(b) %}
                {% set day.due = day.due + 1 %}
                {% if states(task.entity) | int(0) | bitwise_and(b) %}{% set day.done = day.done + 1 %}{% endif %}
              {% endif %}
            {% endfor %}
            {% if day.due > 0 and day.done == day.due %}{% set ns.total = ns.total + 1 %}{% endif %}
          {% endfor %}
          {{ ns.total }}
    - variables:
        dias_perfectos_cierre: '{{ calculo_dias_semana | int(0) }}'
        racha_diaria_fin: |-
          {{
            states('input_number.champ_player2_streak_days')
            | int(0)
          }}
    - variables:
        bonus_semana: |-
          {{
            (dias_perfectos_cierre | int)
            *
            (
              states('input_number.champ_xp_daily_bonus')
              | int(25)
            )
          }}
        xp_bruto: |-
          {{
            (xp_tareas | int)
            +
            (bonus_semana | int)
          }}
        porcentaje_cumplimiento: '{{ (misiones_completadas | float(0) / misiones_previstas | float(1) * 100) | round(2)
          if misiones_previstas | int(0) > 0 else 0 }}'
        objetivo_semanal_pct: |-
          {{
            states('input_number.champ_weekly_goal_pct')
            | float(75)
          }}
        objetivo_conseguido: '{{ 1 if misiones_previstas | int(0) > 0 and porcentaje_cumplimiento | float(0) >=
          objetivo_semanal_pct | float(75) else 0 }}'
        racha_semanal_inicio: |-
          {{
            states(
              'input_number.champ_player2_streak_weeks'
            ) | int(0)
          }}
    - variables:
        racha_semanal_fin: |-
          {% if objetivo_conseguido | int(0) == 1 %}
            {{ (racha_semanal_inicio | int(0)) + 1 }}
          {% else %}
            0
          {% endif %}
        multiplicador_aplicado: |-
          {% if
            objetivo_conseguido | int(0) == 1
            and
            racha_semanal_inicio | int(0) >= 1
          %}
            {{
              states(
                'input_number.champ_weekly_streak_multiplier'
              ) | float(1.25)
            }}
          {% else %}
            1
          {% endif %}
    - variables:
        xp_con_racha: |-
          {{
            (
              (xp_bruto | float(0))
              *
              (multiplicador_aplicado | float(1))
            ) | round(0) | int
          }}
        xp_efectivo: |-
          {{
            [
              (xp_con_racha | int)
              -
              (penalizaciones | int),
              0
            ] | max
          }}
    - variables:
        nivel_inicio: |-
          {{
            (
              (
                states(
                  'input_number.champ_player2_points_total'
                ) | int(0)
              ) // 500
            ) + 1
          }}
        nivel_fin: |-
          {{
            (
              (
                (
                  states(
                    'input_number.champ_player2_points_total'
                  ) | int(0)
                )
                +
                (xp_efectivo | int)
              ) // 500
            ) + 1
          }}
    - condition: template
      value_template: |-
        {% set start = states('input_datetime.champ_season_start') %} {{ start not in ['', 'unknown', 'unavailable']
           and inicio_semana | string >= start }}
    - action: shell_command.champ_db_close_week
      data:
        player_key: player2
        year: '{{ ano_semana | int }}'
        iso_week: '{{ numero_semana | int }}'
        week_start: '{{ inicio_semana }}'
        week_end: '{{ fin_semana }}'
        season_number: '{{ temporada | int }}'
        tasks_due: '{{ misiones_previstas | int }}'
        tasks_completed: '{{ misiones_completadas | int }}'
        task_xp: '{{ xp_tareas | int }}'
        perfect_days: '{{ dias_perfectos_cierre | int }}'
        bonus_xp: '{{ bonus_semana | int }}'
        penalty_xp: '{{ penalizaciones | int }}'
        effective_xp: '{{ xp_efectivo | int }}'
        level_start: '{{ nivel_inicio | int }}'
        level_end: '{{ nivel_fin | int }}'
        weekly_goal_achieved: '{{ objetivo_conseguido | int }}'
        daily_streak_end: '{{ racha_diaria_fin | int }}'
        weekly_streak_end: '{{ racha_semanal_fin | int }}'
      response_variable: resultado
    - condition: template
      value_template: '{{ resultado.returncode | int == 0 }}'
    - variables:
        respuesta_db: '{{ resultado.stdout | from_json }}'
    - condition: template
      value_template: |-
        {{
          respuesta_db.ok | default(false)
          and
          states(
            'input_text.champ_player2_last_applied_week'
          ) != clave_semana
        }}
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player2_points_total
      data:
        value: '{{ respuesta_db.lifetime_xp | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player2_streak_days
      data:
        value: '{{ respuesta_db.daily_streak_end | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player2_streak_weeks
      data:
        value: '{{ respuesta_db.weekly_streak_end | int(0) }}'
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{
              states(
                'input_text.champ_player2_active_week'
              ) in [
                '',
                'unknown',
                'unavailable',
                clave_semana
              ]
            }}
        sequence:
        - if:
          - condition: template
            value_template: '{{ task_entities | length > 0 }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: '{{ task_entities }}'
            data:
              value: 0
        - action: input_number.set_value
          target:
            entity_id: input_number.champ_player2_penalties_this_week
          data:
            value: 0
        - action: input_text.set_value
          target:
            entity_id: input_text.champ_player2_active_week
          data:
            value: '{{ clave_semana_actual }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.champ_player2_last_applied_week
      data:
        value: '{{ clave_semana }}'
template:
- sensor:
  - name: player2 - Nivel Level Up Family
    unique_id: player2_nivel_champion
    default_entity_id: sensor.player2_nivel_champion
    icon: mdi:shield-star
    state: '{% set total = states(''input_number.champ_player2_points_total'') | int(0) %} {{ (total // 500) + 1
      }}'
  - name: player2 - XP nivel actual
    unique_id: player2_xp_nivel_actual
    unit_of_measurement: XP
    icon: mdi:star-circle-outline
    state: '{% set total = states(''input_number.champ_player2_points_total'') | int(0) %} {{ total % 500 }}'
  - name: player2 - XP siguiente nivel
    unique_id: player2_xp_siguiente_nivel
    unit_of_measurement: XP
    icon: mdi:star-circle
    state: '500'
  - name: player2 - Progreso de nivel
    unique_id: player2_progreso_de_nivel
    unit_of_measurement: '%'
    icon: mdi:progress-star
    state: '{% set total = states(''input_number.champ_player2_points_total'') | int(0) %} {{ ((total % 500) / 500
      * 100) | round(1) }}'
  - name: player2 - Misiones completadas calculadas
    unique_id: player2_misiones_completadas_calculadas
    unit_of_measurement: misiones
    icon: mdi:clipboard-check
    state: |-
      {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
      {% set ns = namespace(total=0) %}
      {% for task in tasks %}
      {% set mask = states(task.entity) | int(0) | bitwise_and(task.days) %}
      {% if task.once %}{% if mask > 0 %}{% set ns.total = ns.total + 1 %}{% endif %}{% else %}
      {% for b in [1,2,4,8,16,32,64] %}{% if mask | bitwise_and(b) %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}{% endif %}
      {% endfor %}
      {{ ns.total }}
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
  - name: player2 - XP tareas semana
    unique_id: player2_xp_tareas_semana
    unit_of_measurement: XP
    icon: mdi:star
    state: |-
      {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
      {% set ns = namespace(total=0) %}
      {% for task in tasks %}
      {% set mask = states(task.entity) | int(0) | bitwise_and(task.days) %}
      {% if task.once %}{% if mask > 0 %}{% set ns.total = ns.total + task.xp %}{% endif %}{% else %}
      {% for b in [1,2,4,8,16,32,64] %}{% if mask | bitwise_and(b) %}{% set ns.total = ns.total + task.xp %}{% endif %}{% endfor %}{% endif %}
      {% endfor %}
      {{ ns.total }}
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
  - name: player2 - Días perfectos semana
    unique_id: player2_dias_perfectos_semana
    unit_of_measurement: días
    icon: mdi:trophy-variant
    state: |-
      {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
      {% set ns = namespace(total=0) %}
      {% set limit = 7 if states('input_text.champ_player2_active_week') != now().strftime('%G-W%V') else now().weekday() %}
      {% for i in range(limit | int) %}
        {% set b = [1,2,4,8,16,32,64][i] %}
        {% set day = namespace(due=0, done=0) %}
        {% for task in tasks if not task.once %}
          {% if task.days | bitwise_and(b) %}
            {% set day.due = day.due + 1 %}
            {% if states(task.entity) | int(0) | bitwise_and(b) %}{% set day.done = day.done + 1 %}{% endif %}
          {% endif %}
        {% endfor %}
        {% if day.due > 0 and day.done == day.due %}{% set ns.total = ns.total + 1 %}{% endif %}
      {% endfor %}
      {{ ns.total }}
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
  - name: player2 - XP bonus semana
    unique_id: player2_xp_bonus_semana
    unit_of_measurement: XP
    icon: mdi:trophy-award
    state: |-
      {{
        (
          states('sensor.player2_dias_perfectos_semana') | int(0)
        )
        *
        (
          states('input_number.champ_xp_daily_bonus') | int(25)
        )
      }}
  - name: player2 - XP semana bruto
    unique_id: player2_xp_semana_bruto
    unit_of_measurement: XP
    icon: mdi:star-box
    state: |-
      {{
        (
          states('sensor.player2_xp_tareas_semana') | int(0)
        )
        +
        (
          states('sensor.player2_xp_bonus_semana') | int(0)
        )
      }}
  - name: player2 - XP semana efectivo
    unique_id: player2_xp_semana_efectivo
    unit_of_measurement: XP
    icon: mdi:star-check
    state: |-
      {% set bruto =
        states('sensor.player2_xp_semana_bruto') | int(0)
      %}
      {% set penalizaciones =
        states(
          'input_number.champ_player2_penalties_this_week'
        ) | int(0)
      %}
      {{ [bruto - penalizaciones, 0] | max }}
  - name: player2 - Misiones previstas calculadas
    unique_id: player2_misiones_previstas_calculadas
    default_entity_id: sensor.player2_misiones_previstas_calculadas
    unit_of_measurement: misiones
    icon: mdi:clipboard-list
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
    state: |-
      {% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player', 'eq', 'player2') | list %}
      {% set ns = namespace(total=0) %}
      {% for task in tasks %}
      {% if task.once %}{% if task.days > 0 %}{% set ns.total = ns.total + 1 %}{% endif %}{% else %}
      {% for b in [1,2,4,8,16,32,64] %}{% if task.days | bitwise_and(b) %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}{% endif %}
      {% endfor %}
      {{ ns.total }}
- binary_sensor:
  - name: player2 - Objetivo semanal conseguido
    unique_id: player2_objetivo_semanal_conseguido
    icon: mdi:target-account
    state: '{{ (states(''sensor.player2_misiones_previstas_calculadas'') | float(0)) > 0 and ((states(''sensor.player2_misiones_completadas_calculadas'')
      | float(0)) / (states(''sensor.player2_misiones_previstas_calculadas'') | float(0)) * 100 if (states(''sensor.player2_misiones_previstas_calculadas'')
      | float(0)) > 0 else 0) >= states(''input_number.champ_weekly_goal_pct'') | float(75) }}'
    attributes:
      misiones_completadas: |-
        {{
          states(
            'sensor.player2_misiones_completadas_calculadas'
          ) | int(0)
        }}
      misiones_previstas: '{{ states(''sensor.player2_misiones_previstas_calculadas'') | float(0) | int(0) }}'
      porcentaje_actual: '{{ ((states(''sensor.player2_misiones_completadas_calculadas'') | float(0)) / (states(''sensor.player2_misiones_previstas_calculadas'')
        | float(0)) * 100 if (states(''sensor.player2_misiones_previstas_calculadas'') | float(0)) > 0 else 0) |
        round(2) }}'
      objetivo_pct: |-
        {{
          states('input_number.champ_weekly_goal_pct')
          | float(75)
        }}
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
automation:
- id: champ_player2_cierre_diario_0005
  alias: Level Up Family - player2 - Cierre diario 00:05
  description: Consolida a las 00:05 el resultado del día anterior en SQLite y actualiza la racha diaria viva.
  trigger:
  - platform: time
    at: 00:05:00
  condition: []
  action:
  - variables:
      fecha_ayer: '{{ (now() - timedelta(days=1)).date().isoformat() }}'
  - action: script.champ_player2_cerrar_dia
    data:
      fecha: '{{ fecha_ayer }}'
  mode: single
- id: champ_player2_recuperar_cierre_diario_arranque
  alias: Level Up Family - player2 - Recuperar cierre diario al arrancar
  description: Si Home Assistant estaba apagado a las 00:05, intenta consolidar el día anterior al arrancar, siempre
    que sus bitmasks sigan perteneciendo a la semana activa.
  trigger:
  - platform: homeassistant
    event: start
  condition: []
  action:
  - delay: 00:00:20
  - variables:
      fecha_ayer: '{{ (now() - timedelta(days=1)).date().isoformat() }}'
      ultimo_cierre: '{{ states(''input_text.champ_player2_last_daily_close'') }}'
  - condition: template
    value_template: '{{ ultimo_cierre != fecha_ayer }}'
  - action: script.champ_player2_cerrar_dia
    data:
      fecha: '{{ fecha_ayer }}'
  mode: single
