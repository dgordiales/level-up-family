input_number:
  luf_season_number:
    name: Level Up Family - Temporada actual
    min: 1
    max: 12
    step: 1
    mode: box
    icon: mdi:shield-star
  luf_xp_minor:
    name: Level Up Family - XP misión sencilla
    min: 0
    max: 100
    step: 5
    mode: box
    initial: 10
    icon: mdi:star-outline
  luf_xp_standard:
    name: Level Up Family - XP misión estándar
    min: 0
    max: 100
    step: 5
    mode: box
    initial: 15
    icon: mdi:star-half-full
  luf_xp_complex:
    name: Level Up Family - XP misión importante
    min: 0
    max: 100
    step: 5
    mode: box
    initial: 20
    icon: mdi:star
  luf_xp_daily_bonus:
    name: Level Up Family - Bonus diario
    min: 0
    max: 200
    step: 5
    mode: box
    initial: 25
    icon: mdi:trophy-award
  luf_weekly_goal_pct:
    name: Level Up Family - Objetivo semanal
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 75
    unit_of_measurement: '%'
    icon: mdi:target
  luf_weekly_streak_multiplier:
    name: Level Up Family - Multiplicador racha semanal
    min: 1
    max: 3
    step: 0.05
    mode: box
    initial: 1.25
    icon: mdi:creation
  luf_penalty_minor:
    name: Level Up Family - Penalización leve
    min: 0
    max: 200
    step: 5
    mode: box
    icon: mdi:alert-outline
  luf_penalty_medium:
    name: Level Up Family - Penalización media
    min: 0
    max: 200
    step: 5
    mode: box
    icon: mdi:alert
  luf_penalty_major:
    name: Level Up Family - Penalización grave
    min: 0
    max: 500
    step: 5
    mode: box
    icon: mdi:alert-octagon
input_text:
  luf_current_season:
    name: Level Up Family - Nombre temporada actual
    max: 50
    icon: mdi:shield-star
input_datetime:
  luf_season_start:
    name: Level Up Family - Inicio de temporada
    has_date: true
    has_time: false
    icon: mdi:calendar-start
template:
- sensor:
  - name: Level Up Family - Carpeta temporada
    unique_id: luf_season_folder
    default_entity_id: sensor.luf_season_folder
    icon: mdi:folder-image
    state: "{% set temporada = states('input_number.luf_season_number') | int(1) %} {% if temporada < 10 %}\n\
      \  season_0{{ temporada }}\n{% else %}\n  season_{{ temporada }}\n{% endif %}"
  - name: Level Up Family - Ruta temporada
    unique_id: luf_season_path
    default_entity_id: sensor.luf_season_path
    icon: mdi:folder-multiple-image
    state: "{% set temporada = states('input_number.luf_season_number') | int(1) %} {% if temporada < 10 %}\n\
      \  /local/level_up_family/season_0{{ temporada }}\n{% else %}\n  /local/level_up_family/season_{{ temporada\
      \ }}\n{% endif %}"
script:
  luf_marcar_mision:
    alias: Level Up Family - Marcar misión
    icon: mdi:checkbox-marked-circle-outline
    fields:
      tarea:
        name: Tarea semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        required: true
        selector:
          date: null
    sequence:
    - action: script.luf_task_mutate
      data:
        operation: mark
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  luf_desmarcar_mision:
    alias: Level Up Family - Desmarcar misión
    icon: mdi:checkbox-blank-circle-outline
    fields:
      tarea:
        name: Tarea semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        required: true
        selector:
          date: null
    sequence:
    - action: script.luf_task_mutate
      data:
        operation: unmark
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  luf_aplicar_penalizacion:
    alias: Level Up Family - Aplicar penalización
    icon: mdi:alert-octagon-outline
    fields:
      player_key:
        name: Clave del jugador
        description: player1 = player1 / player2 = player2
        required: true
        selector:
          text: null
      penalizaciones:
        name: Penalizaciones semanales
        description: Contador semanal de penalizaciones del jugador
        required: true
        selector:
          entity:
            domain: input_number
      motivo:
        name: Motivo
        required: true
        selector:
          text: null
      cantidad:
        name: XP de penalización
        required: true
        selector:
          number:
            min: 1
            max: 500
            step: 1
            unit_of_measurement: XP
    sequence:
    - condition: state
      entity_id: input_boolean.luf_maintenance
      state: 'off'
    - action: shell_command.luf_db_add_penalty
      data:
        player_key: '{{ player_key }}'
        amount: '{{ cantidad | int }}'
        reason: '{{ motivo }}'
      response_variable: resultado
    - condition: template
      value_template: '{{ resultado.returncode | int == 0 }}'
    - variables:
        actual: '{{ states(penalizaciones) | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: '{{ penalizaciones }}'
      data:
        value: "{{\n  (actual | int)\n  +\n  (cantidad | int)\n}}"
  luf_anular_penalizacion:
    alias: Level Up Family - Anular penalización
    icon: mdi:undo-variant
    fields:
      penalty_id:
        name: ID de penalización
        required: true
        selector:
          number:
            min: 1
            max: 999999
            step: 1
            mode: box
    sequence:
    - condition: state
      entity_id: input_boolean.luf_maintenance
      state: 'off'
    - action: shell_command.luf_db_cancel_penalty
      data:
        penalty_id: '{{ penalty_id | int }}'
      response_variable: resultado
    - condition: template
      value_template: '{{ resultado.returncode | int == 0 }}'
    - variables:
        penalizacion: '{{ resultado.stdout | from_json }}'
    - variables:
        jugador: '{{ penalizacion.player_key }}'
        importe: '{{ penalizacion.amount | int }}'
    - variables:
        entidad_penalizaciones: '{{ (state_attr(''sensor.luf_family'',''players'') | default([], true) | selectattr(''db_key'',''eq'',jugador)
          | map(attribute=''penalty_entity'') | list | first) | default(''unknown'') }}'
    - condition: template
      value_template: '{{ entidad_penalizaciones != ''unknown'' }}'
    - action: input_number.set_value
      target:
        entity_id: '{{ entidad_penalizaciones }}'
      data:
        value: "{{\n  [\n    (states(entidad_penalizaciones) | int(0))\n    -\n    (importe | int),\n    0\n  ]\
          \ | max\n}}"
input_boolean:
  luf_maintenance:
    name: Level Up Family - Mantenimiento
    icon: mdi:tools
