automation:
- id: champ_player1_week_initialization
  alias: Level Up Family - player1 - Inicializar semana activa
  description: Inicializa la semana activa si todavía no existe, sin cerrar semanas anteriores.
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: |-
      {{ states('input_text.champ_player1_active_week')
         in ['', 'unknown', 'unavailable'] }}
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.champ_player1_active_week
    data:
      value: |-
        {{
          '%04d-W%02d'
          | format(
              now().strftime('%G') | int,
              now().strftime('%V') | int
            )
        }}
  mode: single
- id: champ_player1_weekly_close
  alias: Level Up Family - player1 - Cierre semanal
  description: Cierra la última semana completa cada lunes y recupera cierres pendientes tras reinicios.
  triggers:
  - trigger: time
    at: 00:10:00
    id: lunes
  - trigger: homeassistant
    event: start
    id: arranque
  conditions:
  - condition: template
    value_template: |-
      {% set clave_cierre =
        '%04d-W%02d'
        | format(
            (now() - timedelta(days=now().isoweekday())).strftime('%G') | int,
            (now() - timedelta(days=now().isoweekday())).strftime('%V') | int
          )
      %} {{
        (
          trigger.id == 'lunes'
          and now().isoweekday() == 1
        )
        or
        (
          trigger.id == 'arranque'
          and states('input_text.champ_player1_last_applied_week')
              not in ['', 'unknown', 'unavailable']
          and states('input_text.champ_player1_last_applied_week')
              != clave_cierre
        )
      }}
  actions:
  - action: script.champ_player1_cerrar_semana
  mode: single
