# ============================================================
# LEVEL UP FAMILY - ADMINISTRACIÓN
# ============================================================

input_number:

  champ_penalty_id_to_cancel:
    name: Level Up Family - ID multa a anular
    icon: mdi:numeric
    min: 1
    max: 999999
    step: 1
    mode: box


# ============================================================
# SENSOR - MULTAS ACTIVAS
# ============================================================

command_line:

  - sensor:
      name: "Champion - Multas activas"
      unique_id: champion_multas_activas

      command: >-
        python3 /config/level_up_family/python/champion_active_penalties.py

      scan_interval: 15

      value_template: >-
        {{ value_json.count | int(0) }}

      json_attributes:
        - error
        - items

      icon: mdi:alert-octagon-outline


# ============================================================
# SCRIPT - ANULAR MULTA SELECCIONADA
#
# El dashboard solo tiene que establecer el ID en:
# input_number.champ_penalty_id_to_cancel
#
# Este script lee el ID desde HA y llama al script central.
# Así evitamos Jinja dentro del dashboard Lovelace.
# ============================================================

script:

  champ_anular_penalizacion_seleccionada:
    alias: "Level Up Family - Anular multa seleccionada"
    icon: mdi:undo-variant
    mode: single

    sequence:
      # Impide escrituras durante la migración o el reinicio manual.
      - condition: state
        entity_id: input_boolean.champ_maintenance
        state: "off"

      - variables:
          penalty_id: >-
            {{
              states(
                'input_number.champ_penalty_id_to_cancel'
              ) | int(0)
            }}

      - condition: template
        value_template: >-
          {{ penalty_id | int > 0 }}

      - action: script.champ_anular_penalizacion
        data:
          penalty_id: "{{ penalty_id | int }}"
# Los IDs se conservan para que los paneles existentes sigan funcionando.
homeassistant:
  customize:
    sensor.champion_multas_activas:
      friendly_name: Level Up Family - Multas activas
    sensor.champion_historico:
      friendly_name: Level Up Family - Histórico
