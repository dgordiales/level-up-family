input_text:
  champ_player1_todays_tasks:
    name: player1 - Misiones de hoy
    max: 255
    icon: mdi:format-list-checks
  champ_player1_weekly_tip:
    name: player1 - Consejo semanal
    max: 255
    icon: mdi:lightbulb-outline
  champ_player1_last_applied_week:
    name: Level Up Family - player1 - Última semana aplicada
    max: 10
  champ_player1_active_week:
    name: Level Up Family - player1 - Semana activa
    max: 10
  champ_player1_last_daily_close:
    name: Level Up Family - player1 - Último cierre diario
    max: 10
  champ_player1_weekly_reward:
    name: player1 - Recompensa semanal
    max: 255
    icon: mdi:gift-outline
input_datetime:
  champ_player1_last_task_completion:
    name: player1 - Última misión completada
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline
  champ_player1_task_date:
    name: player1 - Fecha misión
    has_date: true
    has_time: false
    icon: mdi:calendar-edit
script:
  champ_player1_marcar_mision:
    alias: Level Up Family - player1 - Marcar misión
    icon: mdi:check-circle-outline
    mode: queued
    fields:
      tarea:
        name: Tarea semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        required: true
        selector:
          date: null
    sequence:
    - condition: template
      value_template: '{{ ''player1'' in (state_attr(''sensor.champ_family'',''active_ids'') | default([], true))
        }}'
    - action: script.champ_task_mutate
      data:
        operation: mark
        player: player1
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  champ_player1_desmarcar_mision:
    alias: Level Up Family - player1 - Desmarcar misión
    icon: mdi:checkbox-blank-circle-outline
    mode: queued
    fields:
      tarea:
        name: Tarea semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        required: true
        selector:
          date: null
    sequence:
    - condition: template
      value_template: '{{ ''player1'' in (state_attr(''sensor.champ_family'',''active_ids'') | default([], true))
        }}'
    - action: script.champ_task_mutate
      data:
        operation: unmark
        player: player1
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  champ_player1_toggle_mision:
    alias: Level Up Family - player1 - Alternar misión
    icon: mdi:checkbox-marked-circle-auto-outline
    mode: queued
    max: 10
    fields:
      tarea:
        name: Tarea semanal
        description: Entidad input_number que contiene el bitmask semanal
        required: true
        selector:
          entity:
            domain: input_number
      fecha:
        name: Fecha
        description: Fecha de la misión en formato YYYY-MM-DD
        required: true
        selector:
          date: null
    sequence:
    - condition: template
      value_template: '{{ ''player1'' in (state_attr(''sensor.champ_family'',''active_ids'') | default([], true))
        }}'
    - action: script.champ_task_mutate
      data:
        operation: toggle
        player: player1
        entity: '{{ tarea }}'
        fecha: '{{ fecha }}'
      response_variable: mutation
    - condition: template
      value_template: '{{ mutation.ok | default(false) }}'
  champ_player1_cerrar_dia:
    alias: Level Up Family - player1 - Cerrar día
    icon: mdi:calendar-check-outline
    mode: queued
    max: 10
    fields:
      fecha:
        name: Fecha a cerrar
        required: true
        selector:
          date: null
    sequence:
    - condition: template
      value_template: '{{ ''player1'' in (state_attr(''sensor.champ_family'',''active_ids'') | default([], true))
        }}'
    - condition: state
      entity_id: input_boolean.champ_maintenance
      state: 'off'
    - condition: template
      value_template: '{{ has_value(''sensor.champ_task_catalog'') }}'
    - variables:
        fecha_cierre: '{{ fecha }}'
        fecha_obj: '{{ strptime(fecha, ''%Y-%m-%d'') }}'
        semana_fecha: "{{\n  '%04d-W%02d'\n  | format(\n      strptime(fecha, '%Y-%m-%d').isocalendar().year | int,\n\
          \      strptime(fecha, '%Y-%m-%d').isocalendar().week | int\n    )\n}}"
        semana_activa: '{{ states(''input_text.champ_player1_active_week'') }}'
        indice_dia: '{{ strptime(fecha, ''%Y-%m-%d'').weekday() | int }}'
        bit: '{% set d = strptime(fecha, ''%Y-%m-%d'').weekday() %} {{ [1, 2, 4, 8, 16, 32, 64][d] }}'
    - condition: template
      value_template: '{{ semana_fecha == semana_activa }}'
    - variables:
        dia_perfecto: "{% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player',\
          \ 'eq', 'player1') | list %}\n{% set ns = namespace(due=0, done=0) %}\n{% set b = [1,2,4,8,16,32,64][indice_dia\
          \ | int] %}\n{% for task in tasks if not task.once %}\n  {% if task.days | bitwise_and(b) %}\n    {% set\
          \ ns.due = ns.due + 1 %}\n    {% if states(task.entity) | int(0) | bitwise_and(b) %}{% set ns.done = ns.done\
          \ + 1 %}{% endif %}\n  {% endif %}\n{% endfor %}\n{{ 1 if ns.due > 0 and ns.done == ns.due else 0 }}"
    - condition: template
      value_template: "{% set start = states('input_datetime.champ_season_start') %} {{ start not in ['', 'unknown',\
        \ 'unavailable']\n   and fecha_cierre | string >= start }}"
    - action: shell_command.champ_db_close_day
      data:
        player_key: player1
        day_date: '{{ fecha_cierre }}'
        perfect: '{{ dia_perfecto | int }}'
      response_variable: resultado_dia
    - condition: template
      value_template: '{{ resultado_dia.returncode | int == 0 }}'
    - variables:
        respuesta_dia: '{{ resultado_dia.stdout | from_json }}'
    - condition: template
      value_template: '{{ respuesta_dia.ok | default(false) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player1_streak_days
      data:
        value: '{{ respuesta_dia.current_streak | int(0) }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.champ_player1_last_daily_close
      data:
        value: '{{ fecha_cierre }}'
  champ_player1_cerrar_semana:
    alias: Level Up Family - player1 - Cerrar semana
    icon: mdi:calendar-check
    mode: single
    sequence:
    - condition: template
      value_template: '{{ ''player1'' in (state_attr(''sensor.champ_family'',''active_ids'') | default([], true))
        }}'
    - condition: state
      entity_id: input_boolean.champ_maintenance
      state: 'off'
    - condition: template
      value_template: '{{ has_value(''sensor.champ_task_catalog'') }}'
    - variables:
        fin_semana: "{{\n  (\n    now()\n    - timedelta(days=now().isoweekday())\n  ).date()\n}}"
        inicio_semana: "{{\n  (\n    now()\n    - timedelta(days=now().isoweekday() + 6)\n  ).date()\n}}"
        ano_semana: "{{\n  (\n    now()\n    - timedelta(days=now().isoweekday())\n  ).strftime('%G') | int\n}}"
        numero_semana: "{{\n  (\n    now()\n    - timedelta(days=now().isoweekday())\n  ).strftime('%V') | int\n\
          }}"
        clave_semana: "{{\n  '%04d-W%02d'\n  | format(ano_semana | int, numero_semana | int)\n}}"
        clave_semana_actual: "{{\n  '%04d-W%02d'\n  | format(\n      now().strftime('%G') | int,\n      now().strftime('%V')\
          \ | int\n    )\n}}"
        temporada: '{{ states(''input_number.champ_season_number'') | int(1) }}'
        misiones_previstas: '{{ states(''sensor.player1_misiones_previstas_calculadas'') | int(0) }}'
        misiones_completadas: "{{\n  states(\n    'sensor.player1_misiones_completadas_calculadas'\n  ) | int(0)\n\
          }}"
        xp_tareas: "{{\n  states(\n    'sensor.player1_xp_tareas_semana'\n  ) | int(0)\n}}"
        penalizaciones: "{{\n  states(\n    'input_number.champ_player1_penalties_this_week'\n  ) | int(0)\n}}"
        task_entities: '{% set tasks = state_attr(''sensor.champ_task_catalog'', ''tasks'') | default([], true)
          | selectattr(''player'', ''eq'', ''player1'') | list %}

          {{ tasks | map(attribute=''entity'') | list }}'
    - condition: template
      value_template: '{{ states(''input_text.champ_player1_active_week'') == clave_semana or states(''input_text.champ_player1_last_applied_week'')
        == clave_semana }}'
    - variables:
        calculo_dias_semana: "{% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true)\
          \ | selectattr('player', 'eq', 'player1') | list %}\n{% set ns = namespace(total=0) %}\n{% set limit =\
          \ 7 %}\n{% for i in range(limit | int) %}\n  {% set b = [1,2,4,8,16,32,64][i] %}\n  {% set day = namespace(due=0,\
          \ done=0) %}\n  {% for task in tasks if not task.once %}\n    {% if task.days | bitwise_and(b) %}\n  \
          \    {% set day.due = day.due + 1 %}\n      {% if states(task.entity) | int(0) | bitwise_and(b) %}{% set\
          \ day.done = day.done + 1 %}{% endif %}\n    {% endif %}\n  {% endfor %}\n  {% if day.due > 0 and day.done\
          \ == day.due %}{% set ns.total = ns.total + 1 %}{% endif %}\n{% endfor %}\n{{ ns.total }}"
    - variables:
        dias_perfectos_cierre: '{{ calculo_dias_semana | int(0) }}'
        racha_diaria_fin: "{{\n  states('input_number.champ_player1_streak_days')\n  | int(0)\n}}"
    - variables:
        bonus_semana: "{{\n  (dias_perfectos_cierre | int)\n  *\n  (\n    states('input_number.champ_xp_daily_bonus')\n\
          \    | int(25)\n  )\n}}"
        xp_bruto: "{{\n  (xp_tareas | int)\n  +\n  (bonus_semana | int)\n}}"
        porcentaje_cumplimiento: '{{ (misiones_completadas | float(0) / misiones_previstas | float(1) * 100) | round(2)
          if misiones_previstas | int(0) > 0 else 0 }}'
        objetivo_semanal_pct: "{{\n  states('input_number.champ_weekly_goal_pct')\n  | float(75)\n}}"
        objetivo_conseguido: '{{ 1 if misiones_previstas | int(0) > 0 and porcentaje_cumplimiento | float(0) >=
          objetivo_semanal_pct | float(75) else 0 }}'
        racha_semanal_inicio: "{{\n  states(\n    'input_number.champ_player1_streak_weeks'\n  ) | int(0)\n}}"
    - variables:
        racha_semanal_fin: "{% if objetivo_conseguido | int(0) == 1 %}\n  {{ (racha_semanal_inicio | int(0)) + 1\
          \ }}\n{% else %}\n  0\n{% endif %}"
        multiplicador_aplicado: "{% if\n  objetivo_conseguido | int(0) == 1\n  and\n  racha_semanal_inicio | int(0)\
          \ >= 1\n%}\n  {{\n    states(\n      'input_number.champ_weekly_streak_multiplier'\n    ) | float(1.25)\n\
          \  }}\n{% else %}\n  1\n{% endif %}"
    - variables:
        xp_con_racha: "{{\n  (\n    (xp_bruto | float(0))\n    *\n    (multiplicador_aplicado | float(1))\n  ) |\
          \ round(0) | int\n}}"
        xp_efectivo: "{{\n  [\n    (xp_con_racha | int)\n    -\n    (penalizaciones | int),\n    0\n  ] | max\n\
          }}"
    - variables:
        nivel_inicio: "{{\n  (\n    (\n      states(\n        'input_number.champ_player1_points_total'\n      )\
          \ | int(0)\n    ) // 500\n  ) + 1\n}}"
        nivel_fin: "{{\n  (\n    (\n      (\n        states(\n          'input_number.champ_player1_points_total'\n\
          \        ) | int(0)\n      )\n      +\n      (xp_efectivo | int)\n    ) // 500\n  ) + 1\n}}"
    - condition: template
      value_template: "{% set start = states('input_datetime.champ_season_start') %} {{ start not in ['', 'unknown',\
        \ 'unavailable']\n   and inicio_semana | string >= start }}"
    - action: shell_command.champ_db_close_week
      data:
        player_key: player1
        year: '{{ ano_semana | int }}'
        iso_week: '{{ numero_semana | int }}'
        week_start: '{{ inicio_semana }}'
        week_end: '{{ fin_semana }}'
        season_number: '{{ temporada | int }}'
        tasks_due: '{{ misiones_previstas | int }}'
        tasks_completed: '{{ misiones_completadas | int }}'
        task_xp: '{{ xp_tareas | int }}'
        perfect_days: '{{ dias_perfectos_cierre | int }}'
        bonus_xp: '{{ bonus_semana | int }}'
        penalty_xp: '{{ penalizaciones | int }}'
        effective_xp: '{{ xp_efectivo | int }}'
        level_start: '{{ nivel_inicio | int }}'
        level_end: '{{ nivel_fin | int }}'
        weekly_goal_achieved: '{{ objetivo_conseguido | int }}'
        daily_streak_end: '{{ racha_diaria_fin | int }}'
        weekly_streak_end: '{{ racha_semanal_fin | int }}'
      response_variable: resultado
    - condition: template
      value_template: '{{ resultado.returncode | int == 0 }}'
    - variables:
        respuesta_db: '{{ resultado.stdout | from_json }}'
    - condition: template
      value_template: "{{\n  respuesta_db.ok | default(false)\n  and\n  states(\n    'input_text.champ_player1_last_applied_week'\n\
        \  ) != clave_semana\n}}"
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player1_points_total
      data:
        value: '{{ respuesta_db.lifetime_xp | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player1_streak_days
      data:
        value: '{{ respuesta_db.daily_streak_end | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.champ_player1_streak_weeks
      data:
        value: '{{ respuesta_db.weekly_streak_end | int(0) }}'
    - choose:
      - conditions:
        - condition: template
          value_template: "{{\n  states(\n    'input_text.champ_player1_active_week'\n  ) in [\n    '',\n    'unknown',\n\
            \    'unavailable',\n    clave_semana\n  ]\n}}"
        sequence:
        - if:
          - condition: template
            value_template: '{{ task_entities | length > 0 }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: '{{ task_entities }}'
            data:
              value: 0
        - action: input_number.set_value
          target:
            entity_id: input_number.champ_player1_penalties_this_week
          data:
            value: 0
        - action: input_text.set_value
          target:
            entity_id: input_text.champ_player1_active_week
          data:
            value: '{{ clave_semana_actual }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.champ_player1_last_applied_week
      data:
        value: '{{ clave_semana }}'
template:
- sensor:
  - name: player1 - Nivel Level Up Family
    unique_id: player1_nivel_champion
    default_entity_id: sensor.player1_nivel_champion
    icon: mdi:shield-star
    state: '{% set total = states(''input_number.champ_player1_points_total'') | int(0) %} {{ (total // 500) + 1
      }}'
  - name: player1 - XP nivel actual
    unique_id: player1_xp_nivel_actual
    unit_of_measurement: XP
    icon: mdi:star-circle-outline
    state: '{% set total = states(''input_number.champ_player1_points_total'') | int(0) %} {{ total % 500 }}'
  - name: player1 - XP siguiente nivel
    unique_id: player1_xp_siguiente_nivel
    unit_of_measurement: XP
    icon: mdi:star-circle
    state: '500'
  - name: player1 - Progreso de nivel
    unique_id: player1_progreso_de_nivel
    unit_of_measurement: '%'
    icon: mdi:progress-star
    state: '{% set total = states(''input_number.champ_player1_points_total'') | int(0) %} {{ ((total % 500) / 500
      * 100) | round(1) }}'
  - name: player1 - Misiones completadas calculadas
    unique_id: player1_misiones_completadas_calculadas
    unit_of_measurement: misiones
    icon: mdi:clipboard-check
    state: '{% set tasks = state_attr(''sensor.champ_task_catalog'', ''tasks'') | default([], true) | selectattr(''player'',
      ''eq'', ''player1'') | list %}

      {% set ns = namespace(total=0) %}

      {% for task in tasks %}

      {% set mask = states(task.entity) | int(0) | bitwise_and(task.days) %}

      {% if task.once %}{% if mask > 0 %}{% set ns.total = ns.total + 1 %}{% endif %}{% else %}

      {% for b in [1,2,4,8,16,32,64] %}{% if mask | bitwise_and(b) %}{% set ns.total = ns.total + 1 %}{% endif %}{%
      endfor %}{% endif %}

      {% endfor %}

      {{ ns.total }}'
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
  - name: player1 - XP tareas semana
    unique_id: player1_xp_tareas_semana
    unit_of_measurement: XP
    icon: mdi:star
    state: '{% set tasks = state_attr(''sensor.champ_task_catalog'', ''tasks'') | default([], true) | selectattr(''player'',
      ''eq'', ''player1'') | list %}

      {% set ns = namespace(total=0) %}

      {% for task in tasks %}

      {% set mask = states(task.entity) | int(0) | bitwise_and(task.days) %}

      {% if task.once %}{% if mask > 0 %}{% set ns.total = ns.total + task.xp %}{% endif %}{% else %}

      {% for b in [1,2,4,8,16,32,64] %}{% if mask | bitwise_and(b) %}{% set ns.total = ns.total + task.xp %}{% endif
      %}{% endfor %}{% endif %}

      {% endfor %}

      {{ ns.total }}'
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
  - name: player1 - Días perfectos semana
    unique_id: player1_dias_perfectos_semana
    unit_of_measurement: días
    icon: mdi:trophy-variant
    state: "{% set tasks = state_attr('sensor.champ_task_catalog', 'tasks') | default([], true) | selectattr('player',\
      \ 'eq', 'player1') | list %}\n{% set ns = namespace(total=0) %}\n{% set limit = 7 if states('input_text.champ_player1_active_week')\
      \ != now().strftime('%G-W%V') else now().weekday() %}\n{% for i in range(limit | int) %}\n  {% set b = [1,2,4,8,16,32,64][i]\
      \ %}\n  {% set day = namespace(due=0, done=0) %}\n  {% for task in tasks if not task.once %}\n    {% if task.days\
      \ | bitwise_and(b) %}\n      {% set day.due = day.due + 1 %}\n      {% if states(task.entity) | int(0) | bitwise_and(b)\
      \ %}{% set day.done = day.done + 1 %}{% endif %}\n    {% endif %}\n  {% endfor %}\n  {% if day.due > 0 and\
      \ day.done == day.due %}{% set ns.total = ns.total + 1 %}{% endif %}\n{% endfor %}\n{{ ns.total }}"
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
  - name: player1 - XP bonus semana
    unique_id: player1_xp_bonus_semana
    unit_of_measurement: XP
    icon: mdi:trophy-award
    state: "{{\n  (\n    states('sensor.player1_dias_perfectos_semana') | int(0)\n  )\n  *\n  (\n    states('input_number.champ_xp_daily_bonus')\
      \ | int(25)\n  )\n}}"
  - name: player1 - XP semana bruto
    unique_id: player1_xp_semana_bruto
    unit_of_measurement: XP
    icon: mdi:star-box
    state: "{{\n  (\n    states('sensor.player1_xp_tareas_semana') | int(0)\n  )\n  +\n  (\n    states('sensor.player1_xp_bonus_semana')\
      \ | int(0)\n  )\n}}"
  - name: player1 - XP semana efectivo
    unique_id: player1_xp_semana_efectivo
    unit_of_measurement: XP
    icon: mdi:star-check
    state: "{% set bruto =\n  states('sensor.player1_xp_semana_bruto') | int(0)\n%}\n{% set penalizaciones =\n \
      \ states(\n    'input_number.champ_player1_penalties_this_week'\n  ) | int(0)\n%}\n{{ [bruto - penalizaciones,\
      \ 0] | max }}"
  - name: player1 - Misiones previstas calculadas
    unique_id: player1_misiones_previstas_calculadas
    default_entity_id: sensor.player1_misiones_previstas_calculadas
    unit_of_measurement: misiones
    icon: mdi:clipboard-list
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
    state: '{% set tasks = state_attr(''sensor.champ_task_catalog'', ''tasks'') | default([], true) | selectattr(''player'',
      ''eq'', ''player1'') | list %}

      {% set ns = namespace(total=0) %}

      {% for task in tasks %}

      {% if task.once %}{% if task.days > 0 %}{% set ns.total = ns.total + 1 %}{% endif %}{% else %}

      {% for b in [1,2,4,8,16,32,64] %}{% if task.days | bitwise_and(b) %}{% set ns.total = ns.total + 1 %}{% endif
      %}{% endfor %}{% endif %}

      {% endfor %}

      {{ ns.total }}'
- binary_sensor:
  - name: player1 - Objetivo semanal conseguido
    unique_id: player1_objetivo_semanal_conseguido
    icon: mdi:target-account
    state: '{{ (states(''sensor.player1_misiones_previstas_calculadas'') | float(0)) > 0 and ((states(''sensor.player1_misiones_completadas_calculadas'')
      | float(0)) / (states(''sensor.player1_misiones_previstas_calculadas'') | float(0)) * 100 if (states(''sensor.player1_misiones_previstas_calculadas'')
      | float(0)) > 0 else 0) >= states(''input_number.champ_weekly_goal_pct'') | float(75) }}'
    attributes:
      misiones_completadas: "{{\n  states(\n    'sensor.player1_misiones_completadas_calculadas'\n  ) | int(0)\n\
        }}"
      misiones_previstas: '{{ states(''sensor.player1_misiones_previstas_calculadas'') | float(0) | int(0) }}'
      porcentaje_actual: '{{ ((states(''sensor.player1_misiones_completadas_calculadas'') | float(0)) / (states(''sensor.player1_misiones_previstas_calculadas'')
        | float(0)) * 100 if (states(''sensor.player1_misiones_previstas_calculadas'') | float(0)) > 0 else 0) |
        round(2) }}'
      objetivo_pct: "{{\n  states('input_number.champ_weekly_goal_pct')\n  | float(75)\n}}"
    availability: '{{ has_value(''sensor.champ_task_catalog'') }}'
automation:
- id: champ_player1_cierre_diario_0005
  alias: Level Up Family - player1 - Cierre diario 00:05
  description: Consolida a las 00:05 el resultado del día anterior en SQLite y actualiza la racha diaria viva.
  trigger:
  - platform: time
    at: 00:05:00
  condition: []
  action:
  - variables:
      fecha_ayer: '{{ (now() - timedelta(days=1)).date().isoformat() }}'
  - action: script.champ_player1_cerrar_dia
    data:
      fecha: '{{ fecha_ayer }}'
  mode: single
- id: champ_player1_recuperar_cierre_diario_arranque
  alias: Level Up Family - player1 - Recuperar cierre diario al arrancar
  description: Si Home Assistant estaba apagado a las 00:05, intenta consolidar el día anterior al arrancar, siempre
    que sus bitmasks sigan perteneciendo a la semana activa.
  trigger:
  - platform: homeassistant
    event: start
  condition: []
  action:
  - delay: 00:00:20
  - variables:
      fecha_ayer: '{{ (now() - timedelta(days=1)).date().isoformat() }}'
      ultimo_cierre: '{{ states(''input_text.champ_player1_last_daily_close'') }}'
  - condition: template
    value_template: '{{ ultimo_cierre != fecha_ayer }}'
  - action: script.champ_player1_cerrar_dia
    data:
      fecha: '{{ fecha_ayer }}'
  mode: single
