    - type: custom:button-card
      entity: sensor.luf_multas_activas
      show_icon: false
      show_name: false
      show_state: false
      triggers_update:
      - sensor.luf_multas_activas
      - sensor.luf_theme
      styles:
        card:
        - padding: 14px
        - background: rgba(4,14,38,.94)
        - border: 1px solid rgba(101,221,255,.35)
        - border-radius: 20px
        - box-shadow: none
        - color: '#ffffff'
        - --lf-accent: '[[[ const accent = states[''sensor.luf_theme'']?.attributes?.accent; return /^#[a-fA-F0-9]{3,8}$/.test(accent
            || '''') ? accent : ''#65ddff''; ]]]'
        - --lf-panel-border: rgba(101,221,255,.35)
        - --lf-panel-divider: rgba(101,221,255,.18)
        - --lf-panel-inset: rgba(101,221,255,.06)
        custom_fields:
          content:
          - width: 100%
        icon:
        - color: var(--lf-accent)
        name:
        - color: '#ffffff'
        state:
        - color: var(--lf-accent)
        label:
        - color: rgba(255,255,255,.72)
      custom_fields:
        content: "[[[\n  const dbEntity = states['sensor.luf_multas_activas'];\n  if (!dbEntity || ['unknown',\
          \ 'unavailable'].includes(dbEntity.state)\n      || dbEntity.attributes?.error || !Array.isArray(dbEntity.attributes?.items))\
          \ {\n    return `<div style=\"padding:8px;color:var(--error-color);\">\n      ⚠️ Base de datos no disponible.\
          \ Revisa el sensor y los registros de Home Assistant.\n    </div>`;\n  }\n\n  const e = states['sensor.luf_multas_activas'];\n\
          \  const items = e?.attributes?.items || [];\n\n  if (!items.length) {\n    return `\n      <div style=\"\
          text-align:center;opacity:.72;padding:8px 0;\">\n        ✅ No hay multas activas\n      </div>\n    `;\n\
          \  }\n\n  const playerName = p =>\n    p === 'player1' ? 'player1' :\n    p === 'player2' ? 'player2'\
          \ : p;\n\n  return `\n    <div style=\"\n      width:100%;\n      display:grid;\n      grid-template-columns:70px\
          \ 1fr 90px 2fr;\n      gap:7px 12px;\n      align-items:center;\n      font-size:12px;\n    \">\n    \
          \  <div style=\"font-weight:800;opacity:.65;\">ID</div>\n      <div style=\"font-weight:800;opacity:.65;\"\
          >NIÑO</div>\n      <div style=\"font-weight:800;opacity:.65;\">MULTA</div>\n      <div style=\"font-weight:800;opacity:.65;\"\
          >MOTIVO</div>\n\n      ${items.map(x => `\n        <div style=\"font-weight:900;\">#${x.penalty_id}</div>\n\
          \        <div>${playerName(x.player_key)}</div>\n        <div style=\"font-weight:900;\">−${x.amount}\
          \ XP</div>\n        <div style=\"opacity:.82;\">${x.reason || 'Sin motivo'}</div>\n      `).join('')}\n\
          \    </div>\n  `;\n]]]\n"
