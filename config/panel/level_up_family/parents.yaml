title: Level Up Family - parents
button_card_templates:
  luf_metric:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
      - padding: 12px
      - border-radius: 14px
      grid:
      - grid-template-areas: '"i n" "i s"'
      - grid-template-columns: 38px 1fr
      - grid-template-rows: min-content min-content
      icon:
      - width: 24px
      name:
      - justify-self: start
      - font-size: 12px
      - opacity: 0.72
      state:
      - justify-self: start
      - font-size: 18px
      - font-weight: 700
  luf_status:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
      - padding: 12px
      - border-radius: 14px
      grid:
      - grid-template-areas: '"i n s"'
      - grid-template-columns: 32px 1fr auto
      icon:
      - width: 21px
      name:
      - justify-self: start
      - font-size: 13px
      state:
      - justify-self: end
      - font-size: 13px
      - font-weight: 700
views:
- title: Control Level Up Family
  path: control-luf
  icon: mdi:shield-account
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: '# 🏆 CONTROL LEVEL UP FAMILY

        **Temporada:** {{ states(''input_number.luf_season_number'') | int }} · {{ state_attr(''sensor.luf_theme'',
        ''season_name'') or states(''input_text.luf_current_season'') }}


        **Inicio:** {{ states(''input_datetime.luf_season_start'') }} · **Último día:** {{ states(''sensor.luf_season_end'')
        }}

        **Estado:** {{ states(''sensor.luf_season_status'') }} · **Días restantes (incluye hoy):** {{ states(''sensor.luf_season_days_remaining'')
        }}

        **Objetivo semanal:** {{ states(''input_number.luf_weekly_goal_pct'') | int }}% · **Bonus por racha:**
        ×{{ states(''input_number.luf_weekly_streak_multiplier'') }}


        ℹ️ **Ayuda:** en ordenador, deja el cursor sobre el texto de ayuda de cada métrica. En pantalla táctil,
        pulsa la métrica para abrir *Más información*.

        '
      grid_options:
        columns: 24
        rows: auto
      card_mod:
        style: ":host {\n  --lf-accent: {{ state_attr('sensor.luf_theme', 'accent') or '#65ddff' }};\n  --primary-text-color:\
          \ #ffffff;\n  --secondary-text-color: rgba(255,255,255,.72);\n  --primary-color: var(--lf-accent);\n \
          \ --state-icon-color: var(--lf-accent);\n  --state-icon-active-color: var(--lf-accent);\n  --card-mod-icon-color:\
          \ var(--lf-accent);\n  --ha-card-header-color: #ffffff;\n  --ha-card-background: rgba(4,14,38,.94);\n\
          \  --ha-card-border-color: rgba(101,221,255,.35);\n  --ha-card-border-radius: 20px;\n  --ha-card-box-shadow:\
          \ none;\n  color: #ffffff;\n}\nha-card {\n  background: rgba(4,14,38,.94);\n  border: 1px solid rgba(101,221,255,.35);\n\
          \  border-radius: 20px;\n  box-shadow: none;\n  color: #ffffff;\n}\n"
  - type: grid
    cards:
    - type: heading
      heading: player1
      icon: mdi:account
      card_mod:
        style: ":host {\n  --lf-accent: {{ state_attr('sensor.luf_theme', 'accent') or '#65ddff' }};\n  --primary-text-color:\
          \ #ffffff;\n  --secondary-text-color: rgba(255,255,255,.72);\n  --primary-color: var(--lf-accent);\n \
          \ --state-icon-color: var(--lf-accent);\n  --state-icon-active-color: var(--lf-accent);\n  --card-mod-icon-color:\
          \ var(--lf-accent);\n  --ha-card-header-color: #ffffff;\n  --ha-card-background: rgba(4,14,38,.94);\n\
          \  --ha-card-border-color: rgba(101,221,255,.35);\n  --ha-card-border-radius: 20px;\n  --ha-card-box-shadow:\
          \ none;\n  color: #ffffff;\n}\nha-card {\n  background: rgba(4,14,38,.94);\n  border: 1px solid rgba(101,221,255,.35);\n\
          \  border-radius: 20px;\n  box-shadow: none;\n  color: #ffffff;\n}\n"
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:button-card
        template: luf_metric
        entity: sensor.player1_nivel_luf
        name: Nivel
        icon: mdi:shield-star-outline
        custom_fields:
          tooltip: '[[[ return `<span title="Nivel Level Up Family actual. Cada nivel requiere 500 XP acumulados."
            style="position:absolute;inset:0;"></span>`; ]]]

            '
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
          card:
          - background: rgba(4,14,38,.94)
          - border: 1px solid rgba(101,221,255,.35)
          - border-radius: 20px
          - box-shadow: none
          - color: '#ffffff'
          - --lf-accent: '[[[ const accent = states[''sensor.luf_theme'']?.attributes?.accent; return /^#[a-fA-F0-9]{3,8}$/.test(accent
              || '''') ? accent : ''#65ddff''; ]]]'
          - --lf-panel-border: rgba(101,221,255,.35)
          - --lf-panel-divider: rgba(101,221,255,.18)
          - --lf-panel-inset: rgba(101,221,255,.06)
          icon:
          - color: var(--lf-accent)
          name:
          - color: '#ffffff'
          state:
          - color: var(--lf-accent)
          label:
          - color: rgba(255,255,255,.72)
        triggers_update:
        - sensor.luf_theme
      - type: custom:button-card
