    - type: markdown
      content: '# 📚 HISTÓRICO LEVEL UP FAMILY

        Consulta las **semanas cerradas** y los **resúmenes anuales** almacenados permanentemente en SQLite.


        Los datos de esta vista son históricos. El estado de la semana actual continúa en **Control Level Up Family**.

        '
      grid_options:
        columns: 24
        rows: auto
