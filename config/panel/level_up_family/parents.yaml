        - color: var(--lf-accent)
        label:
        - color: rgba(255,255,255,.72)
      custom_fields:
        content: "[[[\n  const dbEntity = states['sensor.luf_historico'];\n  if (!dbEntity || ['unknown', 'unavailable'].includes(dbEntity.state)\n\
          \      || dbEntity.attributes?.error || !Array.isArray(dbEntity.attributes?.weeks) || !Array.isArray(dbEntity.attributes?.years))\
          \ {\n    return `<div style=\"padding:8px;color:var(--error-color);\">\n      ⚠️ Base de datos no disponible.\
          \ Revisa el sensor y los registros de Home Assistant.\n    </div>`;\n  }\n\n  const e = states['sensor.luf_historico'];\n\
          \  const weeks = e?.attributes?.weeks || [];\n  const years = e?.attributes?.years || [];\n  const error\
          \ = e?.attributes?.error;\n\n  if (error) {\n    return `\n      <div style=\"padding:8px;color:var(--error-color);\"\
          >\n        ⚠️ Base de datos no disponible.\n      </div>\n    `;\n  }\n\n  const realWeeks = weeks.filter(x\
          \ => Number(x.year) !== 2099);\n  const testWeeks = weeks.filter(x => Number(x.year) === 2099);\n\n  return\
          \ `\n    <div style=\"\n      display:grid;\n      grid-template-columns:repeat(3,1fr);\n      gap:12px;\n\
          \      width:100%;\n    \">\n      <div style=\"text-align:center;\">\n        <div style=\"font-size:11px;opacity:.65;font-weight:800;\"\
          >\n          SEMANAS REALES\n        </div>\n        <div style=\"font-size:26px;font-weight:900;color:var(--lf-accent);\"\
          >\n          ${realWeeks.length}\n        </div>\n      </div>\n      <div style=\"text-align:center;\"\
          >\n        <div style=\"font-size:11px;opacity:.65;font-weight:800;\">\n          RESÚMENES ANUALES\n\
          \        </div>\n        <div style=\"font-size:26px;font-weight:900;color:var(--lf-accent);\">\n    \
          \      ${years.filter(x => Number(x.year) !== 2099).length}\n        </div>\n      </div>\n      <div\
          \ style=\"text-align:center;\">\n        <div style=\"font-size:11px;opacity:.65;font-weight:800;\">\n\
          \          DATOS DE PRUEBA\n        </div>\n        <div style=\"font-size:26px;font-weight:900;color:var(--lf-accent);\"\
          >\n          ${testWeeks.length}\n        </div>\n      </div>\n    </div>\n  `;\n]]]\n"
