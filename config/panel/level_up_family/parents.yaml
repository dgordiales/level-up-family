            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
    - type: custom:button-card
      template: champ_metric
      entity: sensor.player2_misiones_completadas_calculadas
      name: Misiones completadas
      show_label: true
      label: '[[[ return `de ${states[''sensor.player2_misiones_previstas_calculadas'']?.state || 0} misiones`;
        ]]]'
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:button-card
        template: champ_metric
        entity: sensor.player2_dias_perfectos_semana
        name: Días perfectos
        icon: mdi:trophy-outline
        custom_fields:
          tooltip: |
            [[[ return `<span title="Días ya finalizados en los que player2 completó todas las misiones obligatorias de ese día. La misión de mochila no cuenta para el día perfecto." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
      - type: custom:button-card
        template: champ_metric
        entity: input_number.champ_player2_streak_days
        name: Racha diaria
        icon: mdi:fire
