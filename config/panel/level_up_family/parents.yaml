    - type: markdown
      content: '## ↩️ Anular multa

        Aquí aparecen las **multas activas registradas en SQLite**. Cada multa conserva su ID único, el niño, el
        importe y el motivo.


        Para anular una multa concreta, copia su **ID** en el selector inferior y pulsa **ANULAR MULTA**. La multa
        no se borra del histórico: pasa a estado cancelado y se devuelve su XP al acumulado semanal del niño.

        '
      card_mod:
        style: ":host {\n  --lf-accent: {{ state_attr('sensor.luf_theme', 'accent') or '#65ddff' }};\n  --primary-text-color:\
          \ #ffffff;\n  --secondary-text-color: rgba(255,255,255,.72);\n  --primary-color: var(--lf-accent);\n \
          \ --state-icon-color: var(--lf-accent);\n  --state-icon-active-color: var(--lf-accent);\n  --card-mod-icon-color:\
