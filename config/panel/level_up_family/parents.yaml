            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
      - type: custom:button-card
        template: champ_metric
        entity: input_number.champ_player2_streak_weeks
        name: Racha semanal
        icon: mdi:calendar-check-outline
        custom_fields:
          tooltip: |
            [[[ return `<span title="Semanas consecutivas en las que player2 alcanzó el objetivo semanal configurado." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
    - type: markdown
      content: "### Estado semanal\n**Objetivo:** {% set c = states('sensor.player2_misiones_completadas_calculadas')\
        \ | float(0) %}{% set g = states('input_number.champ_weekly_goal_pct') | float(75) %}{% if is_state('binary_sensor.player2_objetivo_semanal_conseguido',\
        \ 'on') %}✅ Conseguido{% else %}⏳ Pendiente{% endif %}\n\n**Multas:** {{ states('input_number.champ_player2_penalties_this_week')\
        \ | int }} XP\n\n**Bonus de racha:** {% if states('input_number.champ_player2_streak_weeks') | int >= 2\
        \ %}⚡ Activo ×{{ states('input_number.champ_weekly_streak_multiplier') }}{% else %}Pendiente{% endif %}\n\
        \nℹ️ **Objetivo semanal:** se consigue al alcanzar el porcentaje configurado de misiones.  \nℹ️ **Multas:**\
        \ XP descontado esta semana; no reduce el XP histórico.  \nℹ️ **Bonus de racha:** se activa desde la segunda\
        \ semana buena consecutiva.\n"
  - type: grid
    column_span: 2
    cards:
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: markdown
        content: |
          ## 🚨 Multas
          Las multas se descuentan del **XP efectivo semanal** y quedan registradas en SQLite. **No eliminan XP del total histórico.**

          **Ayuda**
          - **Leve · −10 XP:** incidencia menor.
          - **Media · −20 XP:** incumplimiento relevante.
          - **Grave · −40 XP:** conducta o incumplimiento importante.
      - type: grid
        columns: 2
        square: false
        cards:
        - type: vertical-stack
          cards:
          - type: markdown
            content: |
              ### player1
          - type: horizontal-stack
            cards:
            - type: button
              name: Leve · −10 XP
              icon: mdi:alert-circle-outline
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.champ_aplicar_penalizacion
                data:
                  player_key: player1
                  penalizaciones: input_number.champ_player1_penalties_this_week
                  motivo: Multa leve desde Control Level Up Family
                  cantidad: 10
                confirmation:
                  text: ¿Aplicar una multa leve de 10 XP a player1?
              hold_action:
                action: none
            - type: button
              name: Media · −20 XP
              icon: mdi:alert
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.champ_aplicar_penalizacion
                data:
                  player_key: player1
                  penalizaciones: input_number.champ_player1_penalties_this_week
                  motivo: Multa media desde Control Level Up Family
                  cantidad: 20
                confirmation:
                  text: ¿Aplicar una multa media de 20 XP a player1?
              hold_action:
                action: none
            - type: button
              name: Grave · −40 XP
              icon: mdi:alert-octagon
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.champ_aplicar_penalizacion
                data:
                  player_key: player1
                  penalizaciones: input_number.champ_player1_penalties_this_week
                  motivo: Multa grave desde Control Level Up Family
                  cantidad: 40
                confirmation:
                  text: ¿Aplicar una multa grave de 40 XP a player1?
              hold_action:
                action: none
        - type: vertical-stack
          cards:
          - type: markdown
            content: |
              ### player2
          - type: horizontal-stack
            cards:
            - type: button
              name: Leve · −10 XP
              icon: mdi:alert-circle-outline
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.champ_aplicar_penalizacion
                data:
                  player_key: player2
                  penalizaciones: input_number.champ_player2_penalties_this_week
                  motivo: Multa leve desde Control Level Up Family
                  cantidad: 10
                confirmation:
                  text: ¿Aplicar una multa leve de 10 XP a player2?
              hold_action:
                action: none
            - type: button
              name: Media · −20 XP
              icon: mdi:alert
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.champ_aplicar_penalizacion
                data:
                  player_key: player2
                  penalizaciones: input_number.champ_player2_penalties_this_week
                  motivo: Multa media desde Control Level Up Family
                  cantidad: 20
                confirmation:
                  text: ¿Aplicar una multa media de 20 XP a player2?
              hold_action:
                action: none
            - type: button
              name: Grave · −40 XP
              icon: mdi:alert-octagon
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.champ_aplicar_penalizacion
                data:
                  player_key: player2
                  penalizaciones: input_number.champ_player2_penalties_this_week
                  motivo: Multa grave desde Control Level Up Family
                  cantidad: 40
                confirmation:
                  text: ¿Aplicar una multa grave de 40 XP a player2?
              hold_action:
                action: none
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: |
        ## 🛠️ Administración
        Utiliza estos controles para **corregir una misión de la semana actual**.

        1. Elige la misión correspondiente al niño.
        2. Indica la fecha que quieres corregir.
        3. Pulsa la misión: si estaba pendiente se marcará; si ya estaba completada se desmarcará.

        ⚠️ La corrección solo funciona con fechas pertenecientes a la **semana Level Up Family activa**.
      grid_options:
        columns: 24
        rows: auto
  - type: grid
    column_span: 2
    columns: 2
    square: false
    cards:
    - type: custom:level-up-family-missions
      player: player1
      title: Misiones de player1
      week: true
    - type: custom:level-up-family-missions
      player: player2
      title: Misiones de player2
      week: true
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: |
        ## ↩️ Anular multa
        Aquí aparecen las **multas activas registradas en SQLite**. Cada multa conserva su ID único, el niño, el importe y el motivo.

        Para anular una multa concreta, copia su **ID** en el selector inferior y pulsa **ANULAR MULTA**. La multa no se borra del histórico: pasa a estado cancelado y se devuelve su XP al acumulado semanal del niño.
    - type: custom:button-card
      entity: sensor.champion_multas_activas
      show_icon: false
      show_name: false
      show_state: false
      triggers_update:
      - sensor.champion_multas_activas
      styles:
        card:
        - padding: 14px
        - border-radius: 14px
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: |
          [[[
            const dbEntity = states['sensor.champion_multas_activas'];
            if (!dbEntity || ['unknown', 'unavailable'].includes(dbEntity.state)
                || dbEntity.attributes?.error || !Array.isArray(dbEntity.attributes?.items)) {
              return `<div style="padding:8px;color:var(--error-color);">
                ⚠️ Base de datos no disponible. Revisa el sensor y los registros de Home Assistant.
              </div>`;
            }

            const e = states['sensor.champion_multas_activas'];
            const items = e?.attributes?.items || [];

            if (!items.length) {
              return `
                <div style="text-align:center;opacity:.72;padding:8px 0;">
                  ✅ No hay multas activas
                </div>
              `;
            }

            const playerName = p =>
              p === 'player1' ? 'player1' :
              p === 'player2' ? 'player2' : p;

            return `
              <div style="
                width:100%;
                display:grid;
                grid-template-columns:70px 1fr 90px 2fr;
                gap:7px 12px;
                align-items:center;
                font-size:12px;
              ">
                <div style="font-weight:800;opacity:.65;">ID</div>
                <div style="font-weight:800;opacity:.65;">NIÑO</div>
                <div style="font-weight:800;opacity:.65;">MULTA</div>
                <div style="font-weight:800;opacity:.65;">MOTIVO</div>

                ${items.map(x => `
                  <div style="font-weight:900;">#${x.penalty_id}</div>
                  <div>${playerName(x.player_key)}</div>
                  <div style="font-weight:900;">−${x.amount} XP</div>
                  <div style="opacity:.82;">${x.reason || 'Sin motivo'}</div>
                `).join('')}
              </div>
            `;
          ]]]
    - type: horizontal-stack
      cards:
      - type: entities
        show_header_toggle: false
        entities:
        - entity: input_number.champ_penalty_id_to_cancel
          name: ID de multa a anular
      - type: button
        name: ANULAR MULTA
        icon: mdi:undo-variant
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.champ_anular_penalizacion_seleccionada
          confirmation:
            text: ¿Anular la multa seleccionada? Se devolverán sus XP semanales, pero seguirá constando en el histórico
              como cancelada.
        hold_action:
          action: none
  theme: Catppuccin Mocha
  cards: []
- title: Histórico Level Up Family
  path: historico-champion
  icon: mdi:history
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: |
        # 📚 HISTÓRICO LEVEL UP FAMILY
        Consulta las **semanas cerradas** y los **resúmenes anuales** almacenados permanentemente en SQLite.

        Los datos de esta vista son históricos. El estado de la semana actual continúa en **Control Level Up Family**.
      grid_options:
        columns: 24
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: custom:button-card
      entity: sensor.champion_historico
      show_icon: false
      show_name: false
      show_state: false
      triggers_update:
      - sensor.champion_historico
      styles:
        card:
        - padding: 14px
        - border-radius: 14px
        custom_fields:
          content:
          - width: 100%
          - justify-self: stretch
          - align-self: start
          - text-align: left
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        content: |
          [[[
            const dbEntity = states['sensor.champion_historico'];
            if (!dbEntity || ['unknown', 'unavailable'].includes(dbEntity.state)
                || dbEntity.attributes?.error || !Array.isArray(dbEntity.attributes?.weeks) || !Array.isArray(dbEntity.attributes?.years)) {
              return `<div style="padding:8px;color:var(--error-color);">
                ⚠️ Base de datos no disponible. Revisa el sensor y los registros de Home Assistant.
              </div>`;
            }

            const e = states['sensor.champion_historico'];
            const weeks = e?.attributes?.weeks || [];
            const years = e?.attributes?.years || [];
            const error = e?.attributes?.error;

            if (error) {
              return `
                <div style="padding:8px;color:var(--error-color);">
                  ⚠️ Base de datos no disponible.
                </div>
              `;
            }

            const realWeeks = weeks.filter(x => Number(x.year) !== 2099);
            const testWeeks = weeks.filter(x => Number(x.year) === 2099);

            return `
              <div style="
                display:grid;
                grid-template-columns:repeat(3,1fr);
                gap:12px;
                width:100%;
              ">
                <div style="text-align:center;">
                  <div style="font-size:11px;opacity:.65;font-weight:800;">
                    SEMANAS REALES
                  </div>
                  <div style="font-size:26px;font-weight:900;">
                    ${realWeeks.length}
                  </div>
                </div>
                <div style="text-align:center;">
                  <div style="font-size:11px;opacity:.65;font-weight:800;">
                    RESÚMENES ANUALES
                  </div>
                  <div style="font-size:26px;font-weight:900;">
                    ${years.filter(x => Number(x.year) !== 2099).length}
                  </div>
                </div>
                <div style="text-align:center;">
                  <div style="font-size:11px;opacity:.65;font-weight:800;">
                    DATOS DE PRUEBA
                  </div>
                  <div style="font-size:26px;font-weight:900;">
                    ${testWeeks.length}
                  </div>
                </div>
              </div>
            `;
          ]]]
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: player1
      icon: mdi:account
    - type: custom:button-card
      entity: sensor.champion_historico
      show_icon: false
      show_name: false
      show_state: false
      triggers_update:
      - sensor.champion_historico
      styles:
        card:
        - padding: 14px
        - border-radius: 14px
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: |
          [[[
            const dbEntity = states['sensor.champion_historico'];
            if (!dbEntity || ['unknown', 'unavailable'].includes(dbEntity.state)
                || dbEntity.attributes?.error || !Array.isArray(dbEntity.attributes?.weeks) || !Array.isArray(dbEntity.attributes?.years)) {
              return `<div style="padding:8px;color:var(--error-color);">
                ⚠️ Base de datos no disponible. Revisa el sensor y los registros de Home Assistant.
              </div>`;
            }

            const years = states['sensor.champion_historico']?.attributes?.years || [];
            const rows = years.filter(x =>
              x.player_key === 'player1' && Number(x.year) !== 2099
            );

            if (!rows.length) {
              return `
                <div style="text-align:center;opacity:.68;padding:12px;">
                  Aún no hay años reales con semanas cerradas.
                </div>
              `;
            }

            const y = rows[0];
            return `
              <div style="width:100%;">
                <div style="font-size:18px;font-weight:900;margin-bottom:12px;">
                  ${y.year}
                </div>
                <div style="
                  display:grid;
                  grid-template-columns:repeat(3,1fr);
