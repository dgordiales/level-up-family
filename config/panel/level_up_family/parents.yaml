title: Level Up Family - parents
button_card_templates:
  champ_metric:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
      - padding: 12px
      - border-radius: 14px
      grid:
      - grid-template-areas: '"i n" "i s"'
      - grid-template-columns: 38px 1fr
      - grid-template-rows: min-content min-content
      icon:
      - width: 24px
      name:
      - justify-self: start
      - font-size: 12px
      - opacity: 0.72
      state:
      - justify-self: start
      - font-size: 18px
      - font-weight: 700
  champ_status:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
      - padding: 12px
      - border-radius: 14px
      grid:
      - grid-template-areas: '"i n s"'
      - grid-template-columns: 32px 1fr auto
      icon:
      - width: 21px
      name:
      - justify-self: start
      - font-size: 13px
      state:
      - justify-self: end
      - font-size: 13px
      - font-weight: 700
views:
- title: Control Level Up Family
  path: control-champion
  icon: mdi:shield-account
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: |
        # 🏆 CONTROL LEVEL UP FAMILY
        **Temporada:** {{ states('input_number.champ_season_number') | int }} · {{ state_attr('sensor.champ_theme', 'season_name') or states('input_text.champ_current_season') }}

        **Inicio:** {{ states('input_datetime.champ_season_start') }} · **Último día:** {{ states('sensor.champ_season_end') }}
        **Estado:** {{ states('sensor.champ_season_status') }} · **Días restantes (incluye hoy):** {{ states('sensor.champ_season_days_remaining') }}
        **Objetivo semanal:** {{ states('input_number.champ_weekly_goal_pct') | int }}% · **Bonus por racha:** ×{{ states('input_number.champ_weekly_streak_multiplier') }}

        ℹ️ **Ayuda:** en ordenador, deja el cursor sobre el texto de ayuda de cada métrica. En pantalla táctil, pulsa la métrica para abrir *Más información*.
      grid_options:
        columns: 24
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: player1
      icon: mdi:account
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:button-card
        template: champ_metric
        entity: sensor.player1_nivel_champion
        name: Nivel
        icon: mdi:shield-star-outline
        custom_fields:
          tooltip: |
            [[[ return `<span title="Nivel Level Up Family actual. Cada nivel requiere 500 XP acumulados." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
      - type: custom:button-card
        template: champ_metric
        entity: input_number.champ_player1_points_total
        name: XP total
        icon: mdi:star-circle-outline
        custom_fields:
          tooltip: |
            [[[ return `<span title="XP histórico acumulado. No disminuye al aplicar multas semanales." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
      - type: custom:button-card
        template: champ_metric
        entity: sensor.player1_xp_semana_efectivo
        name: XP semana
        icon: mdi:lightning-bolt
        custom_fields:
          tooltip: |
            [[[ return `<span title="XP efectivo de la semana: XP de misiones y bonus, descontando las multas aplicadas." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
    - type: custom:button-card
      template: champ_metric
      entity: sensor.player1_misiones_completadas_calculadas
      name: Misiones completadas
      show_label: true
      label: '[[[ return `de ${states[''sensor.player1_misiones_previstas_calculadas'']?.state || 0} misiones`;
        ]]]'
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:button-card
        template: champ_metric
        entity: sensor.player1_dias_perfectos_semana
        name: Días perfectos
        icon: mdi:trophy-outline
        custom_fields:
          tooltip: |
            [[[ return `<span title="Días ya finalizados en los que player1 completó todas las misiones obligatorias de ese día. La misión de mochila no cuenta para el día perfecto." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
      - type: custom:button-card
        template: champ_metric
        entity: input_number.champ_player1_streak_days
        name: Racha diaria
        icon: mdi:fire
        custom_fields:
          tooltip: |
            [[[ return `<span title="Número de días perfectos consecutivos registrados." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
      - type: custom:button-card
        template: champ_metric
        entity: input_number.champ_player1_streak_weeks
        name: Racha semanal
        icon: mdi:calendar-check-outline
        custom_fields:
          tooltip: |
            [[[ return `<span title="Semanas consecutivas en las que player1 alcanzó el objetivo semanal configurado." style="position:absolute;inset:0;"></span>`; ]]]
        styles:
          custom_fields:
            tooltip:
            - position: absolute
            - inset: 0
            - pointer-events: none
    - type: markdown
      content: "### Estado semanal\n**Objetivo:** {% if is_state('binary_sensor.player1_objetivo_semanal_conseguido','on')\
        \ %}✅ Conseguido{% else %}⏳ Pendiente{% endif %}\n\n**Multas:** {{ states('input_number.champ_player1_penalties_this_week')\
        \ | int }} XP\n\n**Bonus de racha:** {% if states('input_number.champ_player1_streak_weeks') | int >= 2\
        \ %}⚡ Activo ×{{ states('input_number.champ_weekly_streak_multiplier') }}{% else %}Pendiente{% endif %}\n\
        \nℹ️ **Objetivo semanal:** se consigue al alcanzar el porcentaje configurado de misiones.  \nℹ️ **Multas:**\
        \ XP descontado esta semana; no reduce el XP histórico.  \nℹ️ **Bonus de racha:** se activa desde la segunda\
        \ semana buena consecutiva.\n"
  - type: grid
    cards:
    - type: heading
      heading: player2
      icon: mdi:account
    - type: grid
