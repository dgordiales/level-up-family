          \ --state-icon-color: var(--lf-accent);\n  --state-icon-active-color: var(--lf-accent);\n  --card-mod-icon-color:\
          \ var(--lf-accent);\n  --ha-card-header-color: #ffffff;\n  --ha-card-background: rgba(4,14,38,.94);\n\
          \  --ha-card-border-color: rgba(101,221,255,.35);\n  --ha-card-border-radius: 20px;\n  --ha-card-box-shadow:\
          \ none;\n  color: #ffffff;\n}\nha-card {\n  background: rgba(4,14,38,.94);\n  border: 1px solid rgba(101,221,255,.35);\n\
          \  border-radius: 20px;\n  box-shadow: none;\n  color: #ffffff;\n}\n"
  - type: grid
